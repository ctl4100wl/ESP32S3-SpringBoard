<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>S3-Springboard</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #canvas {
    display: block;
    /* the 2:3 screen fills the viewport: limited by height on wide windows, by width on phones */
    width: min(100vw, calc(100vh * 2 / 3));
    width: min(100vw, calc(100dvh * 2 / 3));
    aspect-ratio: 2 / 3;
    max-height: 100%;
    background: #000;
    outline: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Game data and your own files: doom1.wad (or doom.wad / doom2.wad / freedoom1.wad) next to this page is loaded before start.
  var Module = {
    canvas: document.getElementById('canvas'), print: console.log, printErr: console.warn,
    preRun: [function() {
      ['doom1.wad', 'doom.wad', 'doom2.wad', 'freedoom1.wad', 'DOOM1.WAD', 'DOOM.WAD', 'DOOM2.WAD'].forEach(function(n) {
        var dep = 'wad_' + n;
        Module.addRunDependency(dep);
        fetch(n).then(function(r) { return r.ok ? r.arrayBuffer() : null; }).then(function(b) {
          if(b && b.byteLength > 1000000) FS.createDataFile('/', n.toLowerCase(), new Uint8Array(b), true, true);
          Module.removeRunDependency(dep);
        }).catch(function() { Module.removeRunDependency(dep); });
      });
    }]
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
